services:
  - type: web
    name: aicg-security-gateway
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: AEGIS_DEV_AUTO_AUTH
        value: "0"
